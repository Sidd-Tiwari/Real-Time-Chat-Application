<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Real-Time Chat Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.2.0/bundles/stomp.umd.js"></script>
    <style>
        body { background: #f2f4f7; }
        .chat-card { max-width: 640px; margin: 0 auto; }
        #chat-window {
            height: 440px;
            overflow-y: auto;
            padding: 16px;
            background: #eef1f5;
            display: flex;
            flex-direction: column;
        }
        .bubble-row { display: flex; margin-bottom: 10px; }
        .bubble-row.mine { justify-content: flex-end; }
        .bubble {
            max-width: 70%;
            padding: 8px 12px;
            border-radius: 14px;
            line-height: 1.35;
            word-wrap: break-word;
        }
        .bubble .sender {
            display: block;
            font-size: 0.72rem;
            font-weight: 600;
            opacity: 0.7;
            margin-bottom: 2px;
        }
        .bubble .time {
            display: block;
            font-size: 0.65rem;
            opacity: 0.55;
            margin-top: 2px;
            text-align: right;
        }
        .bubble-row.mine .bubble { background: #0d6efd; color: #fff; border-bottom-right-radius: 4px; }
        .bubble-row.theirs .bubble { background: #ffffff; color: #212529; border: 1px solid #e2e5ea; border-bottom-left-radius: 4px; }
        #status-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 6px; background: #dc3545; }
        #status-dot.connected { background: #198754; }
        #typing-indicator { font-size: 0.8rem; color: #6c757d; height: 18px; padding-left: 4px; }
        #empty-state { margin: auto; color: #98a2b3; font-size: 0.9rem; }
    </style>
</head>
<body>
<div class="container mt-4 chat-card">
    <div class="d-flex align-items-center justify-content-between mb-3">
        <h1 class="h4 mb-0">Real-Time Chat</h1>
        <div class="small text-muted"><span id="status-dot"></span><span id="status-text">Connecting…</span></div>
    </div>

    <div class="card">
        <div id="chat-window">
            <div id="empty-state">No messages yet — say hi 👋</div>
        </div>
        <div id="typing-indicator"></div>

        <div class="card-body border-top">
            <div class="input-group">
                <input type="text" id="messageInput" class="form-control" placeholder="Type your message…" maxlength="1000" disabled>
                <button id="sendMessage" class="btn btn-primary" disabled>Send</button>
            </div>
        </div>
    </div>
</div>

<!-- Simple one-time name prompt, shown as a modal instead of re-asking per message -->
<div id="nameModal" class="modal d-block" tabindex="-1" style="background: rgba(0,0,0,0.5);">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-body p-4">
                <h5 class="mb-3">What's your name?</h5>
                <input type="text" id="senderInput" class="form-control mb-3" placeholder="Your name…" maxlength="40">
                <button id="joinBtn" class="btn btn-primary w-100">Join chat</button>
            </div>
        </div>
    </div>
</div>

<script>
    let stompClient = null;
    let currentUser = null;
    let typingTimeout = null;
    const TYPING_TIMER_MS = 1500;

    const chatWindow = document.getElementById('chat-window');
    const emptyState = document.getElementById('empty-state');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendMessage');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const typingIndicator = document.getElementById('typing-indicator');

    function setConnected(connected) {
        statusDot.classList.toggle('connected', connected);
        statusText.textContent = connected ? 'Connected' : 'Connecting…';
        sendBtn.disabled = !connected;
        messageInput.disabled = !connected;
    }

    function formatTime(ts) {
        if (!ts) return '';
        const d = new Date(ts);
        return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    // Renders text safely (no innerHTML with raw user content -> no XSS)
    function showMessage(message) {
        emptyState.remove();

        const row = document.createElement('div');
        row.classList.add('bubble-row', message.sender === currentUser ? 'mine' : 'theirs');

        const bubble = document.createElement('div');
        bubble.classList.add('bubble');

        const senderEl = document.createElement('span');
        senderEl.classList.add('sender');
        senderEl.textContent = message.sender;

        const contentEl = document.createElement('span');
        contentEl.textContent = message.content;

        const timeEl = document.createElement('span');
        timeEl.classList.add('time');
        timeEl.textContent = formatTime(message.timestamp);

        bubble.appendChild(senderEl);
        bubble.appendChild(document.createElement('br'));
        bubble.appendChild(contentEl);
        bubble.appendChild(timeEl);
        row.appendChild(bubble);
        chatWindow.appendChild(row);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    async function loadHistory() {
        try {
            const res = await fetch('/api/history');
            const messages = await res.json();
            messages.forEach(showMessage);
        } catch (e) {
            console.warn('Could not load history', e);
        }
    }

    function connect() {
        const protocol = location.protocol === 'https:' ? 'wss://' : 'ws://';
        const socket = new WebSocket(protocol + location.host + '/ws');
        stompClient = StompJs.Stomp.over(socket);
        stompClient.reconnectDelay = 3000; // auto-retry on drop

        stompClient.onConnect = function () {
            setConnected(true);
            stompClient.subscribe('/topic/messages', function (message) {
                showMessage(JSON.parse(message.body));
            });
            stompClient.subscribe('/topic/typing', function (message) {
                const sender = JSON.parse(message.body);
                if (sender === currentUser) return;
                typingIndicator.textContent = sender + ' is typing…';
                clearTimeout(typingIndicator._clear);
                typingIndicator._clear = setTimeout(() => { typingIndicator.textContent = ''; }, TYPING_TIMER_MS);
            });
        };

        stompClient.onWebSocketClose = function () {
            setConnected(false);
        };

        stompClient.onStompError = function () {
            setConnected(false);
        };

        stompClient.activate();
    }

    function sendMessage() {
        const content = messageInput.value.trim();
        if (!stompClient || !stompClient.connected) return;
        if (!content) return;

        stompClient.publish({
            destination: '/app/sendMessage',
            body: JSON.stringify({ sender: currentUser, content })
        });
        messageInput.value = '';
        messageInput.focus();
    }

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            sendMessage();
        }
    });
    messageInput.addEventListener('input', function () {
        if (!stompClient || !stompClient.connected) return;
        clearTimeout(typingTimeout);
        stompClient.publish({ destination: '/app/typing', body: JSON.stringify(currentUser) });
        typingTimeout = setTimeout(() => {}, TYPING_TIMER_MS);
    });

    // One-time name entry, then hide the modal for the rest of the session
    document.getElementById('joinBtn').addEventListener('click', function () {
        const name = document.getElementById('senderInput').value.trim();
        if (!name) return;
        currentUser = name;
        document.getElementById('nameModal').remove();
        loadHistory().then(() => {
            connect();
            messageInput.focus();
        });
    });

    document.getElementById('senderInput').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') document.getElementById('joinBtn').click();
    });
</script>
</body>
</html>
